# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A proof of Nivat's conjecture"
  description: >-
    A Lean+mathlib proof of Nivat's conjecture: Given a finite alphabet A, we
    consider configurations c: Z^2 -> A, which are arbitrary maps that can be
    thought of as colorings of the 2D lattice. Writing P_c(m, n) for the number
    of distinct m-by-n block patterns occurring in a configuration c, Nivat
    conjectured that if P_c(m, n) <= mn for some positive m and n, then c is
    periodic; that is, there exists nonzero h such that c(v+h) = c(v) for all v.
    The proof is due to GPT-6 Pro.
  authors: ["Boon Suan Ho"]
  author_roles:
    "Boon Suan Ho": >-
      Project initiator, prompter, and maintainer; directed AI generation and
      formalization. This credit does not assert human authorship of the
      mathematical proof, manuscript, or Lean code.
  responsible_maintainers: ["Boon Suan Ho"]
  license: "MIT"

classification:
  arxiv: ["math.DS", "math.CO"]
  msc2020: ["37B10", "68R15"]

# This repository contains the substantive proof development.
# The supplied manuscript is the source being formalized; no originality or
# priority assessment by a human expert is claimed.
sources:
  - title: "Pattern complexity and Nivat's conjecture"
    type: "paper"
    id: "paper/nivat.tex"
    location: "Theorem 1.1 and its proof in Section 6; Sections 1–5 and Appendix A"
    relationship: "formalizes"
    contributors:
      - name: "GPT-6 Pro"
        role: "Proof generation and manuscript writing"
      - name: "Boon Suan Ho"
        role: "Prompting and project direction; no human mathematical authorship claimed"
    license: "MIT"
    author_endorsement: "n/a"
    note: >-
      The maintainer reports that GPT-6 Pro found the proof entirely in response
      to his prompts. The paper was not written or mathematically digested by
      humans. The source is included in this repository, with SHA-256
      4f5f6eba63d10d56d1705b27d92f8e471b3c3f0b2c31cdae836394deb53a78b0.
      Proof-generation conversation transcripts are not included, so the
      attribution is a maintainer disclosure rather than a separately audited
      history. Bibliographic influences are recorded below and in the paper.

  - title: "An Algebraic Geometric Approach to Nivat's Conjecture"
    authors: ["Jarkko Kari", "Michal Szabados"]
    id: "https://arxiv.org/abs/1605.05929v1"
    type: "paper"
    relationship: "adapts"
    location: "Lemmas 5–10 and 32; Theorem 11 and Corollary 12; manuscript Section 3 and Appendix A"
    note: >-
      Credits the polynomial-annihilator method and the prime-dilation argument.
      The low-complexity annihilator and product-annihilator consequences needed
      here are proved locally. Appendix A uses a Laurent interpolation identity
      to perform the elimination. No theorem from this source is assumed as an
      unproved literature dependency; no claim to have formalized the entire
      article is made.

  - title: "Nonexpansive Z^2 subdynamics and Nivat's conjecture"
    authors: ["Van Cyr", "Bryna Kra"]
    id: "https://arxiv.org/abs/1208.4090v2"
    type: "paper"
    relationship: "background"
    location: "Generating and balanced sets; manuscript Introduction and Section 5"
    note: >-
      Credits boundary-extension and discrepancy methods. This paper also
      establishes the mn/2 bound and provides the standard conjecture context.
      The required finite-window and boundary-counting lemmas are proved here.

  - title: "Nivat's conjecture holds for sums of two periodic configurations"
    authors: ["Michal Szabados"]
    id: "https://arxiv.org/abs/1710.05360v1"
    type: "paper"
    relationship: "adapts"
    location: "Two-periodic-summand argument; manuscript Section 5"
    note: >-
      Credits the two-summand result and its boundary/strip method. The project
      proves the finite-rational mixed-difference theorem, including parallel
      directions, through its own checked finite-state, window, and row-lifting
      lemmas. This branch is independent of the main descent and final theorem.

  - title: "Symbolic dynamics"
    authors: ["Marston Morse", "Gustav A. Hedlund"]
    id: "https://doi.org/10.2307/2371264"
    type: "paper"
    relationship: "background"
    location: "American Journal of Mathematics 60 (1938), 815–866"
    author_endorsement: "n/a"
    note: >-
      The one-dimensional Morse–Hedlund implication supplies the word-complexity
      perspective. The direction needed here is proved locally by finite-state
      arguments in Nivat/TwoFactors/FiniteState.lean.

  - title: "Decidability and periodicity of low complexity tilings"
    authors: ["Jarkko Kari", "Etienne Moutot"]
    id: "https://doi.org/10.1007/s00224-021-10063-8"
    type: "paper"
    relationship: "background"
    location: "Theory of Computing Systems 67 (2023), 125–148"
    note: >-
      Credits the transverse-cancellation idea discussed in manuscript Section 3.
      The half-plane cancellation needed by the formalization is proved locally.

  - title: "Expansive subdynamics"
    authors: ["Mike Boyle", "Douglas Lind"]
    id: "https://doi.org/10.1090/S0002-9947-97-01634-6"
    type: "paper"
    relationship: "background"
    location: "Transactions of the AMS 349 (1997), 55–102"
    note: >-
      Context for half-plane and nonexpansive-direction arguments. The precise
      compactness-to-half-plane interface used here has a local proof.

  - title: "Expansive subdynamics for algebraic Z^d-actions"
    authors: ["Manfred Einsiedler", "Douglas Lind", "Richard Miles", "Thomas Ward"]
    id: "https://doi.org/10.1017/S014338570100181X"
    type: "paper"
    relationship: "background"
    location: "Ergodic Theory and Dynamical Systems 21 (2001), 1695–1729"
    note: >-
      Context for the algebraic and nonexpansive-direction viewpoint; none of its
      statements is assumed as an unproved dependency in the Lean development.

related_formalizations: []

status:
  scope: >-
    The full finite-alphabet rectangular-complexity implication on Z^2, together
    with the intermediate results needed by the supplied proof, including its
    finite-rational two-factor theorem. Numbered examples and unnumbered
    illustrations in the manuscript are explanatory, not separate formal
    results. The compared declaration is NivatSubmission.nivat; Nivat.nivat is
    the corresponding reusable library endpoint.
  # Excludes the deliberate statement-only hole in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "NivatSubmission.nivat"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

# Models are credited for the work they generated, separately from human
# responsibility for initiating and maintaining the repository.
automation:
  methods:
    - method: "other"
      models: ["GPT-6 Pro"]
      framework: "ChatGPT"
      tool_setup: >-
        Prompted model generation of the mathematical proof and manuscript.
        Exact backend model snapshots and complete generation traces are not
        available in this repository.
      prompting_notes: >-
        Boon Suan Ho prompted GPT-6 Pro to find a proof of Nivat's conjecture.
        The maintainer attributes the complete proof discovery to that model.
    - method: "agent"
      models: ["GPT-6 Astra"]
      framework: "Codex"
      tool_setup: >-
        Local Lean and mathlib tools, shell access, parallel proof-development
        agents, incremental compilation, source inspection, theorem-type and
        axiom audits, and automated semantic/source reviews. The model name is
        the disclosed product identity, not an immutable backend revision.
      prompting_notes: >-
        Formalize the supplied full proof, prove the two-factor dependency
        internally, preserve exact finite-alphabet and infinite-lattice
        semantics, prohibit unproved assumptions and trust bypasses, then
        refactor for readable correspondence with the manuscript and prepare
        the repository for local Palomar review.
  notes: >-
    Human involvement consisted of prompting, setting requirements, steering,
    and project maintenance. The mathematical proof and paper were not written
    by humans; the Lean code and documentation were generated by AI agents.
    Compilation and kernel checks are mechanical verification, not human
    mathematical review. Full cost and generation-run metadata were not tracked
    in this repository. The maintainer is not a specialist and does not plan to
    undertake mathematical digestion or expert exposition personally; work on
    these by experienced mathematicians is welcome.

fidelity:
  divergences: >-
    No weakening of the final theorem is known from the recorded automated
    statement audits. The Lean statement quantifies over all universes of
    finite alphabets and all Z^2 configurations. It counts restrictions over
    all translations of the original integer rectangle and yields one nonzero
    global period. Rational labeling is an internal proved reduction.
    Supporting interfaces use finite-pattern language inclusion instead of
    orbit-closure hypotheses where that is sufficient; local compactness lemmas
    discharge these hypotheses. Exact-line results package lattice coordinates
    as additive equivalences. The two-factor branch is proved independently of
    the descent. These representational choices are documented in
    docs/SOURCE_MAP.md and docs/READING_GUIDE.md. Formal checking of the Lean
    statements does not validate every sentence of the informal manuscript.

review:
  status: "agent-reviewed"
  reviewers: ["GPT-6 Astra (Codex agents)"]
  notes: >-
    AI agents performed semantic checks of the final theorem and its expanded
    rectangle/pattern/period definitions, source-correspondence reviews, and
    dependency checks. No human expert review is claimed or documented. The paper and formalization
    have not been mathematically digested by humans. No human peer review, independent assessment of
    novelty or priority, or endorsement by the cited authors is claimed.
    Verification commands, tool versions, observed outcomes, and checker
    limitations are recorded in STATUS.md and docs/PALOMAR.md. This metadata
    records review before Palomar submission; it does not claim a Palomar review
    outcome or registration. An empty related_formalizations list means none
    are identified here, not that a comprehensive priority search was done.

alignment:
  namespace: "Nivat"
  statements:
    - source: "Theorem 1.1 (thm:main), proof in Section 6"
      lean: "NivatSubmission.nivat"
      module: "Solution"
      status: "proved"
      note: >-
        The independent Challenge expands the rectangle and pattern count
        entirely in mathlib vocabulary. The Solution uses Nivat.nivat from
        Nivat/Main.lean. docs/SOURCE_MAP.md maps the supporting paper statements
        to their Lean declarations.

acknowledgements: >-
  Lean and mathlib provide the proof assistant and mathematical library.
  Comparator, lean4export, and NanoDa provide the submission verification
  tools. The mathematical sources above are credited for their results and
  methods. The README uses Tao's generation/verification/digestion vocabulary
  to explain the limits of this project, without implying his endorsement.
