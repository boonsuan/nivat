name: Proof and submission checks

# This workflow is prepared locally. Its presence is not evidence of a remote run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "2"
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned metadata-check dependencies
        run: python -m pip install --requirement requirements-checks.txt

      - name: Validate metadata and repository license
        run: python scripts/validate_metadata.py

      - name: Set up the pinned project Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          # Avoid the composite action's mutable GitHub-cache action references.
          use-github-cache: "false"

      - name: Build and audit the public proof
        run: bash scripts/verify.sh

      - name: Set up the Landrun build toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.0"
          cache: false

      - name: Install separate pinned checker build toolchains
        run: |
          elan toolchain install leanprover/lean4:v4.34.0-rc1
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.33.0"

      - name: Build pinned Comparator, exporter, NanoDa, and Landrun
        run: bash scripts/palomar_setup.sh

      - name: Run the Linux sandboxed comparison and NanoDa check
        run: bash scripts/palomar_check.sh
